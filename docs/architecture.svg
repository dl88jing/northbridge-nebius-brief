<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" font-family="Helvetica, Arial, sans-serif">
  <title>Northbridge Brief architecture</title>
  <desc>Bills flow through a deterministic policy gate. Routine bills are auto-handled without model calls. Escalations go to Tavily search and extract, then Nemotron Super writes a cited brief, and Nemotron Ultra reviews high-stakes briefs. Nemotron Nano writes the plan. Every LLM call records tokens and cost into a receipt.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2c4d38"/></marker>
    <style>
      .box{fill:#fbf7ef;stroke:#2c4d38;stroke-width:2;rx:12}
      .llm{fill:#e9f3ec;stroke:#2f6b45;stroke-width:2}
      .ext{fill:#eef3f6;stroke:#3d5c6e;stroke-width:2}
      .det{fill:#f6efe3;stroke:#b56a3a;stroke-width:2}
      .t{font-size:15px;font-weight:700;fill:#1c241c}
      .s{font-size:12px;fill:#4a564a}
      .l{stroke:#2c4d38;stroke-width:2;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="980" height="520" fill="#f4efe4"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#1c241c">Northbridge Brief: quiet by default, cited when it speaks</text>

  <rect class="box" x="30" y="70" width="210" height="70" rx="12"/>
  <text class="t" x="45" y="98">Next.js dashboard</text><text class="s" x="45" y="118">/api/investigate · /api/benchmark</text>

  <rect class="llm" x="268" y="70" width="230" height="70" rx="12"/>
  <text class="t" x="283" y="98">Plan: Nemotron 3 Nano</text><text class="s" x="283" y="118">Token Factory · $0.06 / $0.24 per 1M</text>

  <rect class="det" x="525" y="70" width="180" height="70" rx="12"/>
  <text class="t" x="540" y="98">Tools + policy gate</text><text class="s" x="540" y="118">deterministic, 0 tokens</text>

  <rect class="det" x="760" y="40" width="190" height="60" rx="12"/>
  <text class="t" x="775" y="66">AUTO (silent)</text><text class="s" x="775" y="86">rent, fiber: no ping, no LLM</text>

  <rect class="ext" x="740" y="150" width="210" height="80" rx="12"/>
  <text class="t" x="755" y="176">Tavily</text><text class="s" x="755" y="196">search (advanced, top 5)</text><text class="s" x="755" y="214">+ extract top 3, query-reranked</text>

  <rect class="llm" x="470" y="270" width="250" height="80" rx="12"/>
  <text class="t" x="485" y="296">Brief: Nemotron 3 Super</text><text class="s" x="485" y="316">JSON brief, [n] citations to sources</text><text class="s" x="485" y="334">$0.30 / $0.90 per 1M</text>

  <rect class="llm" x="160" y="270" width="270" height="80" rx="12"/>
  <text class="t" x="175" y="296">Review: Nemotron 3 Ultra</text><text class="s" x="175" y="316">only medical/tax/legal, multi-rule or ≥$500</text><text class="s" x="175" y="334">confirm / revise + unsupported claims</text>

  <rect class="box" x="30" y="400" width="400" height="90" rx="12"/>
  <text class="t" x="45" y="428">Human gets one brief</text><text class="s" x="45" y="448">recommended action, sources, speakable line</text><text class="s" x="45" y="466">offline mode: templates + fixtures, labeled in UI</text>

  <rect class="box" x="470" y="400" width="480" height="90" rx="12"/>
  <text class="t" x="485" y="428">Cost receipt</text><text class="s" x="485" y="448">API-reported tokens × Token Factory list price, per model and step</text><text class="s" x="485" y="466">vs same tokens on Ultra; /api/benchmark runs both for real</text>

  <path class="l" d="M240 105 H266"/>
  <path class="l" d="M498 105 H523"/>
  <path class="l" d="M705 95 L758 75"/>
  <path class="l" d="M705 120 L740 160"/>
  <text class="s" x="610" y="165">HUMAN_REQUIRED</text>
  <path class="l" d="M845 230 L700 268"/>
  <path class="l" d="M470 310 H432"/>
  <path class="l" d="M295 350 V398"/>
  <path class="l" d="M595 350 V398"/>
</svg>
